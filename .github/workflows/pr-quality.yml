name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - 'app/**'
      - 'src/**'
      - 'components/**'
      - 'lib/**'
      - 'pages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'prettier.config.*'

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SECOND_ADMIN_EMAIL: ${{ secrets.E2E_SECOND_ADMIN_EMAIL }}
      E2E_SECOND_ADMIN_PASSWORD: ${{ secrets.E2E_SECOND_ADMIN_PASSWORD }}
      E2E_UNAFFILIATED_ADMIN_EMAIL: ${{ secrets.E2E_UNAFFILIATED_ADMIN_EMAIL }}
      E2E_UNAFFILIATED_ADMIN_PASSWORD: ${{ secrets.E2E_UNAFFILIATED_ADMIN_PASSWORD }}

    steps:
      - name: Check out the PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the project manifest and lockfile
        run: |
          test -f package.json
          test -f pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Generate the non-production E2E seed
        run: scripts/generate-e2e-seed.sh

      - name: Start Supabase
        run: supabase start

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Production build
        run: pnpm run build
